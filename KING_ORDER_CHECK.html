<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KING ORDER CHECK</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f3f4f6;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#c62d12,#e63c1f);color:#fff;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.h1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h1 b{font-size:18px;font-weight:900}
.h1 button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:15px;font-weight:800}
.sw{margin-top:8px;background:#fff;border-radius:999px;padding:0 14px;height:42px;display:flex;align-items:center;gap:8px}
.sw input{border:0;outline:none;flex:1;font-size:16px;background:transparent;color:#111}
.tabs{position:sticky;top:var(--hh,100px);z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;scrollbar-width:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;padding:8px 14px;border-radius:999px;border:2px solid #d5d8dd;background:#fff;font-size:14px;font-weight:800;color:#000}
.tb.on{background:#e63c1f;border-color:#e63c1f;color:#fff}
#sync{font-size:12px;font-weight:700;color:#555;padding:6px 12px}
.oc{background:#fff;margin:8px 10px;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:#fafafa;border-bottom:1px solid #eee}
.oid{font-weight:900;font-size:14px;color:#000}.otm{font-size:12px;color:#555;font-weight:700}
.st{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st.n{background:#fff1ee;color:#b42410}.st.c{background:#e3effd;color:#0b4fa8}.st.d{background:#e3f6e8;color:#0a5d24}.st.x{background:#eee;color:#555}
.sec{padding:10px 12px}.sec+.sec{border-top:1px dashed #ddd}
.sl{font-size:12px;font-weight:900;color:#e63c1f;margin-bottom:6px;letter-spacing:.3px}
.it{display:flex;gap:12px}
.th{flex:none;width:92px;height:92px;border-radius:10px;background:#eceef1;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px}
.th img{width:100%;height:100%;object-fit:contain}
.in{font-size:16px;font-weight:800;color:#000;line-height:1.3}
.pr{margin-top:4px}.pm{font-size:15px;font-weight:700;color:#555;text-decoration:line-through;margin-right:6px}.pg{font-size:20px;font-weight:900;color:#000}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cp{font-size:12px;font-weight:800;background:#f1f2f4;border-radius:8px;padding:3px 9px;color:#000}.cp.w{background:#e3f6e8;color:#0a5d24}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:#fff7e6;border-radius:10px;padding:9px 12px;font-weight:900;font-size:17px}
.kv{display:flex;gap:8px;padding:3px 0;font-size:15px;color:#000}.kv span:first-child{flex:none;width:92px;color:#555;font-weight:700}.kv span:last-child{font-weight:800;word-break:break-word}
.cb{display:flex;gap:8px;margin-top:8px}
.cb a{flex:1;text-align:center;text-decoration:none;padding:10px 6px;border-radius:10px;font-size:14px;font-weight:900}
.ca{background:#e8f0fe;color:#0b4fa8}.cw{background:#dcf8e6;color:#0a5d24}
.ab{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #eee;flex-wrap:wrap}
.ab button{flex:1;min-width:84px;padding:11px 6px;border-radius:10px;border:0;font-size:14px;font-weight:900}
.b1{background:#2563eb;color:#fff}.b2{background:#16a34a;color:#fff}.b3{background:#fde4e1;color:#b42410}.b4{background:#eee;color:#333}
.empty{text-align:center;color:#666;padding:50px 20px;font-weight:700;line-height:1.7}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:flex-end;justify-content:center;padding:10px}#ov.on{display:flex}
.sh{background:#fff;width:100%;max-width:460px;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.sh h3{margin:0;font-size:17px}.sh p{margin:0;font-size:13px;color:#444;line-height:1.5}
.sh input,.sh textarea{width:100%;padding:12px;font-size:15px;border:1px solid #ccd;border-radius:10px;background:#fff;color:#111;font-family:inherit}
.sh textarea{min-height:190px}
.sh .r{display:flex;gap:8px}.sh .r button{flex:1;padding:13px;font-size:16px;font-weight:900;border-radius:12px;border:0}
.ok{background:#e63c1f;color:#fff}.no{background:#eee;color:#222}

.st.n{background:#fff3e0;color:#b45309}.st.c{background:#e3effd;color:#0b4fa8}.st.s{background:#e8e7ff;color:#3730a3}.st.o{background:#e0f7f4;color:#0f766e}.st.d{background:#e3f6e8;color:#0a5d24}.st.x{background:#fde4e1;color:#b42410}
.tk{display:flex;padding:14px 6px 4px;background:#fff}
.tk .t{flex:1;text-align:center;font-size:10.5px;font-weight:800;color:#888;position:relative;padding-top:21px;line-height:1.2}
.tk .t::before{content:"";position:absolute;top:2px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#cfd3d9;z-index:1}
.tk .t::after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:3px;background:#cfd3d9}
.tk .t:first-child::after{display:none}
.tk .t.on{color:#0a5d24}.tk .t.on::before,.tk .t.on::after{background:#16a34a}
.tk .t.bad{color:#b42410}.tk .t.bad::before,.tk .t.bad::after{background:#dc2626}
.nt{margin:6px 12px 10px;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:800;line-height:1.5}
.nt.r{background:#fde4e1;color:#b42410}.nt.g{background:#e3f6e8;color:#0a5d24}.nt.b{background:#e0f7f4;color:#0f766e}
.nt a{color:inherit}
.dl{flex:1 1 100%;background:#f1f9f8;border:1px solid #bfe6e1;border-radius:12px;padding:10px}
.dlt{font-size:14px;font-weight:800;color:#0f766e;margin-bottom:6px}
.dl input{width:100%;padding:12px;font-size:17px;font-weight:800;border:2px solid #0f766e;border-radius:10px;background:#fff;color:#111;letter-spacing:1px}
.dbtn{flex:1 1 100%;display:none;gap:8px}
.dbtn button{flex:1;padding:14px 6px;font-size:15px}
.b5{background:#4f46e5;color:#fff}.b6{background:#0f766e;color:#fff}
#msg{font-size:13px;font-weight:800;color:#c0160c}
.tot.of{background:#e8f0fe;color:#0b4fa8;font-size:15px;margin-top:6px}.tot.of.rf span:last-child{text-decoration:line-through;color:#888}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;border-top:1px solid #d9dce1;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.12)}
.cbar button{width:100%;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:900;background:#4f46e5;color:#fff}.cbar button.on{background:#e63c1f}
#list{padding-bottom:80px}.cimg{width:92px;height:92px;object-fit:cover;border-radius:10px;margin-top:8px}
.c1{background:#4f46e5;color:#fff}.c2{background:#16a34a;color:#fff}.c3{background:#fde4e1;color:#b42410}
</style>
</head>
<body>
<header>
<div class="h1"><b>👑 KING ORDER CHECK</b><div style="display:flex;gap:6px"><button id="bp">📋 पेस्ट</button><button id="br">🔄</button><button id="bs">⚙</button></div></div>
<div class="sw">🔍<input type="search" id="q" placeholder="नाम / मोबाइल / आइटम / ऑर्डर नंबर खोजें"></div>
</header>
<div class="tabs" id="tabs"></div>
<div id="sync"></div>
<div id="list"></div>

<div class="cbar"><button id="bc">🛠 Complaint (0)</button></div>
<div id="ov"><div class="sh" id="shb"></div></div>

<script>
var DEFAULT_URL="https://script.google.com/macros/s/AKfycbwMqxsa0AeHvuvHRK2G7plFFXpAvDrLimyLgs4m6lvA6S5fmlX0yHtZsXCh_bZ7dFqK/exec";            // यहाँ Google Apps Script (Web App) का /exec लिंक डाल सकते हैं (या ⚙ से डालें)
var SRC="kms_orders",LK="kms_orders_page",UK="kms_order_url";
var TABS=[["New","New"],["Confirmed","Confirmed"],["Shipped","Shipped"],["OutForDelivery","Out For Delivery"],["Done","Delivery Done"],["Cancelled","Cancelled"],["All","All"]],tab="New",orders=[],dd={};
var SL={New:"New Order",Confirmed:"Order Confirmed",Shipped:"Shipped",OutForDelivery:"Out For Delivery",Done:"Delivery Done",DelCancelled:"Delivery Cancelled",Cancelled:"Order Cancelled"};
function ns(s){s=String(s==null?"":s).trim();var m={"":"New","नया":"New","कन्फर्म":"Confirmed","डिलीवर्ड":"Done","रद्द":"Cancelled"};return m.hasOwnProperty(s)?m[s]:s}
function inTab(o,t){var s=ns(o.status);if(t==="All")return true;if(t==="Cancelled")return s==="Cancelled"||s==="DelCancelled";return s===t}
function typing(){var a=document.activeElement;return !!(a&&a.hasAttribute&&a.hasAttribute("data-dm"))}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ld(k){try{var a=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function getUrl(){var u="";try{u=localStorage.getItem(UK)||""}catch(e){}return u||DEFAULT_URL}
function num(x){var n=parseFloat(String(x==null?"":x).replace(/,/g,""));return isNaN(n)?null:n}
function inr(x){var n=num(x);return n===null?"":"₹"+(Math.round(n*100)/100).toLocaleString("en-IN")}
function fmt(t){var d=new Date(t);return isNaN(d)?String(t||""):d.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true})}
function tel10(m){var d=String(m||"").replace(/\D/g,"");return d.length>10?d.slice(-10):d}

function load(){orders=ld(LK);orders.forEach(function(o){o.status=ns(o.status)});var ids={};orders.forEach(function(o){ids[o.id]=1});
var add=false;ld(SRC).forEach(function(o){if(o&&o.id&&!ids[o.id]){orders.push(o);ids[o.id]=1;add=true}});
if(add)sv(LK,orders)}
function save(){sv(LK,orders)}

function mergeRemote(arr){var by={};orders.forEach(function(o){by[o.id]=o});var ch=false;
arr.forEach(function(r){if(!r||!r.id)return;r.id=String(r.id);r.mobile=tel10(r.mobile);r.status=ns(r.status);var l=by[r.id];
if(!l){orders.push(r);by[r.id]=r;ch=true;return}
if(l._dirty){if(r.status===l.status){delete l._dirty;ch=true}return}
var was=l.status;
["no","status","item","sku","warranty","mrate","rate","qty","total","stock","name","mobile","delivery","address","city","pin","payment","note","time","dboy","cancelby","upd","offer","offerref","billno"].forEach(function(k){if(r[k]!==undefined&&r[k]!==""&&String(l[k])!==String(r[k])){l[k]=r[k];ch=true}});
if(was!==l.status&&offerRefund(l))ch=true;
if(!l.thumb&&r.thumb){l.thumb=r.thumb;ch=true}});
if(ch)save()}

function post(obj){var u=getUrl();if(!u)return;try{fetch(u,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)}).catch(function(){})}catch(e){}}
function fetchOrders(manual){var u=getUrl(),sy=document.getElementById("sync");
if(!u){sy.textContent="ℹ Google Sheet जुड़ा नहीं है – ⚙ से लिंक डालिए (तब तक सिर्फ़ इसी फ़ोन के / पेस्ट किए ऑर्डर दिखेंगे)";return}
sy.textContent="⏳ Sheet से ऑर्डर ला रहे हैं…";
fetch(u+(u.indexOf("?")<0?"?":"&")+"t="+Date.now()).then(function(r){return r.json()}).then(function(j){
mergeRemote((j&&j.orders)||[]);sy.textContent="✔ अपडेट: "+new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});if(!typing())render()
}).catch(function(){sy.textContent="⚠ Sheet से नहीं जुड़ पाए – इंटरनेट / लिंक जाँचिए"})}

function stCls(s){return {New:"n",Confirmed:"c",Shipped:"s",OutForDelivery:"o",Done:"d"}[s]||"x"}
function drawTabs(){var h="";TABS.forEach(function(T){var c=orders.filter(function(o){return inTab(o,T[0])}).length;
h+='<button class="tb'+(T[0]===tab?' on':'')+'" data-t="'+T[0]+'">'+T[1]+' ('+c+')</button>'});document.getElementById("tabs").innerHTML=h}
function trk(o){var s=ns(o.status),L=["Confirmed","Shipped","Out For Delivery","Delivery Done"],ix={New:-1,Confirmed:0,Shipped:1,OutForDelivery:2,Done:3,DelCancelled:2,Cancelled:-1}[s];
var h="";
if(s!=="Cancelled"){h='<div class="tk">';L.forEach(function(t,i){var c=i<=ix?" on":"";if(s==="DelCancelled"&&i===3){c=" bad";t="Delivery Cancelled"}h+='<div class="t'+c+'">'+t+'</div>'});h+='</div>'}
var dm=tel10(o.dboy);
if(s==="Cancelled")h+='<div class="nt r">❌ ऑर्डर रद्द – '+(o.cancelby==="Customer"?'ग्राहक ने खुद रद्द किया':'दुकान की तरफ़ से रद्द')+'</div>';
if(s==="OutForDelivery"&&dm)h+='<div class="nt b">🛵 डिलीवरी वाला: <a href="tel:'+esc(dm)+'">'+esc(dm)+'</a></div>';
if(s==="Done")h+='<div class="nt g">✅ Delivery Done'+(num(o.offer)>0?' – 🎁 ऑफर '+inr(o.offer)+' उपयोग हुआ':'')+(dm?' – 🛵 डिलीवरी करने वाला: <a href="tel:'+esc(dm)+'">'+esc(dm)+'</a>':'')+'</div>';
if(s==="DelCancelled")h+='<div class="nt r">❌ Delivery Cancelled'+(dm?' – 🛵 डिलीवरी वाला: <a href="tel:'+esc(dm)+'">'+esc(dm)+'</a>':'')+'</div>';
return h}
function isFinal(o){var s=ns(o.status);return s==="Done"||s==="Cancelled"||s==="DelCancelled"}
function actions(o){var s=ns(o.status),id=esc(o.id),h='<div class="ab">';
function B(c,st,t){return '<button class="'+c+'" data-s="'+st+'" data-id="'+id+'">'+t+'</button>'}
if(s==="New")h+=B("b1","Confirmed","✔ Order Confirmed")+B("b3","Cancelled","✖ Cancel Order");
else if(s==="Confirmed")h+=B("b5","Shipped","📦 Shipped")+B("b3","Cancelled","✖ Cancel Order");
else if(s==="Shipped")h+=B("b6","OutForDelivery","🛵 Out For Delivery")+B("b3","Cancelled","✖ Cancel Order");
else if(s==="OutForDelivery"){var dm=dd[o.id]!==undefined?dd[o.id]:(o.dboy||""),ok=tel10(dm).length===10;
h+='<div class="dl"><div class="dlt">'+esc(o.no||"#"+o.id)+' ➜ डिलीवरी वाले का मोबाइल नंबर</div><input type="tel" inputmode="numeric" maxlength="14" data-dm="'+id+'" placeholder="10 अंक का मोबाइल नंबर" value="'+esc(dm)+'"></div>'
+'<div class="dbtn" style="display:'+(ok?'flex':'none')+'">'+B("b2","Done","✅ Done Delivery")+B("b3","DelCancelled","❌ Cancel Delivery")+'</div>'}
return h}
function card(o){
var M=num(o.mrate),R=num(o.rate),im=o.thumb?'<img src="'+esc(o.thumb)+'" alt="">':'📦';
var h='<div class="oc"><div class="oh"><div><div class="oid">'+(o.no?esc(o.no):'#'+esc(o.id)+(getUrl()?' <span style="font-size:11px;color:#888">(नंबर आ रहा है…)</span>':''))+'</div><div class="otm">'+esc(fmt(o.time))+'</div></div><span class="st '+stCls(ns(o.status))+'">'+esc(SL[ns(o.status)]||o.status)+'</span></div>'+trk(o);
h+='<div class="sec"><div class="sl">🛒 आइटम की पूरी जानकारी</div><div class="it"><div class="th">'+im+'</div><div><div class="in">'+esc(o.item)+'</div><div class="pr">'+(M!==null?'<span class="pm">'+inr(M)+'</span>':'')+(R!==null?'<span class="pg">'+inr(R)+'</span>':'')+'</div>';
h+='<div class="ch">'+(o.sku!==""&&o.sku!=null?'<span class="cp">SKU: '+esc(o.sku)+'</span>':'')+(o.warranty?'<span class="cp w">🛡 '+esc(o.warranty)+'</span>':'')+(o.stock?'<span class="cp">Stock: '+esc(o.stock)+'</span>':'')+'<span class="cp">मात्रा: '+esc(o.qty||1)+'</span></div></div></div>';
var T=(o.total!==""&&o.total!=null)?num(o.total):(R!==null?R*(num(o.qty)||1):null),OF=num(o.offer)||0,RF=String(o.offerref)==="1";
h+='<div class="tot"><span>कुल रकम</span><span>'+(T!==null?inr(T):"—")+'</span></div>';
if(OF>0)h+='<div class="tot of'+(RF?' rf':'')+'"><span>🎁 ऑफर'+(RF?' (वापस हुआ)':' (कटा)')+'</span><span>'+(RF?'':'−')+inr(OF)+'</span></div>'+(RF?'':'<div class="tot"><span>देना है</span><span>'+(T!==null?inr(Math.max(0,T-OF)):"—")+'</span></div>');
h+='</div>';
var m=tel10(o.mobile);
h+='<div class="sec"><div class="sl">👤 ग्राहक की पूरी जानकारी</div><div class="kv"><span>नाम</span><span>'+esc(o.name)+'</span></div><div class="kv"><span>मोबाइल</span><span>'+esc(m)+'</span></div>';
h+='<div class="kv"><span>सामान</span><span>'+(o.delivery==="घर"?"🚚 घर पर मँगवाना":"🏪 दुकान से लेना")+'</span></div>';
if(o.delivery==="घर")h+='<div class="kv"><span>पता</span><span>'+esc(o.address)+(o.city?', '+esc(o.city):'')+(o.pin?' - '+esc(o.pin):'')+'</span></div>';
h+='<div class="kv"><span>पेमेंट</span><span>'+esc(o.payment||"—")+'</span></div>';
h+='<div class="kv"><span>ऑर्डर नंबर</span><span style="color:#e63c1f;font-size:17px;letter-spacing:.5px">'+(o.no?esc(o.no):'#'+esc(o.id))+'</span></div>';
if(o.note)h+='<div class="kv"><span>नोट</span><span>'+esc(o.note)+'</span></div>';
h+='<div class="cb"><a class="ca" href="tel:'+esc(m)+'">📞 कॉल करें</a><a class="cw" target="_blank" href="https://wa.me/91'+esc(m)+'">💬 WhatsApp</a></div></div>';
if(isFinal(o)){h+='</div>';return h}
h+=actions(o);
h+='</div></div>';
return h}

function render(){drawTabs();var q=document.getElementById("q").value.trim().toLowerCase(),h="";
var arr=orders.filter(function(o){if(!inTab(o,tab))return false;
if(!q)return true;return [o.no,o.id,o.name,o.mobile,o.item,o.sku,o.address,o.dboy].join(" ").toLowerCase().indexOf(q)>=0});
arr.sort(function(a,b){return String(b.time).localeCompare(String(a.time))});
arr.forEach(function(o){h+=card(o)});
document.getElementById("list").innerHTML=h||'<div class="empty">कोई ऑर्डर नहीं मिला<br>(ग्राहक के ऑर्डर यहाँ अपने आप आएँगे।<br>WhatsApp वाला ऑर्डर 📋 पेस्ट से भी जोड़ सकते हैं)</div>'}

function ornFmt(n){var t=String(n);while(t.length<5)t="0"+t;return "ORN "+t}
function nextLocalNo(){var mx=0;orders.forEach(function(o){var m=String(o.no||"").match(/(\d+)\s*$/);if(m)mx=Math.max(mx,Number(m[1]))});return ornFmt(mx+1)}
var SK="kms_shop_url";
function shopUrl(){var u="";try{u=localStorage.getItem(SK)||""}catch(e){}return u||"KING_MOBILE.html"}
function openShopItem(o){var u=shopUrl(),nm=String(o.item||"").split(" \u2013 ")[0];window.open(u+(u.indexOf("?")<0?"?":"&")+"q="+encodeURIComponent(nm),"_blank")}
function offerRefund(o){var a=num(o.offer)||0,s=ns(o.status);
if(a>0&&(s==="Cancelled"||s==="DelCancelled")&&String(o.offerref)!=="1"){o.offerref="1";save();post({action:"offer",op:"refund",id:o.id,mobile:tel10(o.mobile),amount:a});return true}return false}
function find(id){for(var i=0;i<orders.length;i++)if(String(orders[i].id)===id)return orders[i]}
