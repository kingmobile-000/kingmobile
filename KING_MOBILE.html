<script>
/* ===== उधार + ऑफर: दोनों Daily Hisab से आते हैं (ग्राहक के मोबाइल नंबर के हिसाब से) ===== */
var OFFK="kms_offon",OUSEK="kms_offused";
function offOn(){if(offLocked())return false;try{return localStorage.getItem(OFFK)!=="0"}catch(e){return true}}
function setOffOn(v){try{localStorage.setItem(OFFK,v?"1":"0")}catch(e){}}
/* Daily Hisab का credit, उसमें से वो घटाकर जो इस फ़ोन से ऑर्डर में लग चुका (Daily Hisab में नया आंकड़ा आते ही फिर Daily Hisab का ही माना जाता है) */
function offAvail(){var c=custGet();if(!c.m)return 0;var o=null;try{o=JSON.parse(localStorage.getItem(OUSEK)||"null")}catch(e){}
if(o&&String(o.m)===String(c.m)&&Number(o.sc)===c.credit)return Math.max(0,Math.round((c.credit-Number(o.used||0))*100)/100);return c.credit}
function offConsume(d){var c=custGet();if(!c.m||!(d>0))return;var o=null;try{o=JSON.parse(localStorage.getItem(OUSEK)||"null")}catch(e){}
var u=(o&&String(o.m)===String(c.m)&&Number(o.sc)===c.credit)?Number(o.used||0):0;
try{localStorage.setItem(OUSEK,JSON.stringify({m:c.m,sc:c.credit,used:u+d}))}catch(e){}}
/* ===== उधार हो तो ऑफर बंद (कटा हुआ) जब तक उधार जमा न हो ===== */
function offLocked(){return custGet().due>0}
function offFmt(n){n=Number(n)||0;return n>0?fmtN(n):"00"}
function offMsg(){var d=document.getElementById("offmsg");if(d)d.remove();
d=document.createElement("div");d.id="offmsg";
d.style.cssText="position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:22px";
d.innerHTML='<div style="background:#fff;border-radius:14px;max-width:340px;width:100%;padding:22px 18px 16px;text-align:center;font-family:inherit"><div style="font-size:40px;line-height:1">🔒</div><div style="font-size:17px;font-weight:900;color:#b42410;margin:10px 0 6px">ऑफर अभी बंद है</div><div style="font-size:16px;font-weight:700;color:#222;line-height:1.5">आप अपना पहले उधार जमा करें, फिर आप ऑफर उपयोग कर पाएंगे।</div><div style="font-size:14px;font-weight:800;color:#555;margin-top:8px">आपका उधार: ₹'+fmtN(custGet().due)+'</div><button style="margin-top:14px;border:0;background:#e63c1f;color:#fff;font-weight:900;font-size:16px;border-radius:10px;padding:10px 34px;cursor:pointer;font-family:inherit">ठीक है</button></div>';
d.addEventListener("click",function(){d.remove()});document.body.appendChild(d)}
/* ऑर्डर कैंसिल होने पर ऑफर वापस (इसी फ़ोन से लगे ऑफर के लिए, एक ही बार) */
function offGive(d){var c=custGet();if(!c.m||!(d>0))return;var o=null;try{o=JSON.parse(localStorage.getItem(OUSEK)||"null")}catch(e){}
if(o&&String(o.m)===String(c.m)&&Number(o.sc)===c.credit){try{localStorage.setItem(OUSEK,JSON.stringify({m:c.m,sc:c.credit,used:Math.max(0,Number(o.used||0)-d)}))}catch(e){}}}
function offPost(op,o){if(typeof ORDER_URL==="undefined"||!ORDER_URL)return;try{fetch(ORDER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"offer",op:op,id:o.id,mobile:t10(o.mobile),amount:Number(o.offer)||0})}).catch(function(){})}catch(e){}}
function offSweep(a){var ch=false;a.forEach(function(o){var s=normSt(o.status);
if(o&&Number(o.offer)>0&&(s==="Cancelled"||s==="DelCancelled")&&String(o.offerref)!=="1"){o.offerref="1";ch=true;if(o.offLocal===1)offGive(Number(o.offer));offPost("refund",o)}});return ch}
function offRs(){return offOn()?offAvail():0}   /* ऑफर ON हो तभी छूट लगती है */
function offPU(R0,q){var c=offRs();if(R0===null||R0===undefined||c<=0||!(q>0))return 0;return Math.min(c,R0*q)/q}
var CUSTK="kms_cust";
function custGet(){try{var c=JSON.parse(localStorage.getItem(CUSTK)||"null"),u=JSON.parse(localStorage.getItem("kms_user")||"null");
if(c&&u&&String(c.m)===String(u.m))return{m:c.m,due:Number(c.due)||0,credit:Number(c.credit)||0}}catch(e){}return{m:"",due:0,credit:0}}
function fmtN(n){return(Math.round(Number(n)*100)/100).toLocaleString("en-IN")}
function hasR(o){return o&&o.Rate!==undefined&&o.Rate!==null&&o.Rate!==""}
function effRate(r){var n=parseFloat(String(r==null?"":r).replace(/,/g,""));return isNaN(n)?null:Math.max(0,n-offRs())}
function mkStr(o){return(o.MRate!==undefined&&o.MRate!==null&&o.MRate!=="")?o.MRate:o.Rate}
function offLbl(){var c=offRs();return c>0?"ऑफर ₹"+fmtN(c)+" की छूट":""}
/* ===== माल की सिंक: KING_MOBILE.html वाली वही Google Sheet (Items) -> यह पेज ===== */
var GAS="https://script.google.com/macros/s/AKfycbwBaBcqvnFqmrTE3KpZwab6BUMxeMfmU6q5v0wrZcDQMH4rNyZhxlVtqUFVzKA4Lx0q/exec";
var ITEM_POLL_MS=30000;   /* कितने मिलीसेकंड में माल देखना है (30000 = 30 सेकंड) */
var itemV=null,itemBusy=false,itemFails=0,itemNext=0;
function itKey(o){return String(o.Item==null?"":o.Item).trim().toLowerCase()+"|"+String(o.SKU==null?"":o.SKU).trim().toLowerCase()}
function itOverlay(){var a=["dt","ps","pv","sk","by"];for(var i=0;i<a.length;i++){var e=document.getElementById(a[i]);if(e&&e.classList.contains("on"))return true}return false}
function itApply(list){
if(!list||!list.length)return false;
var idx={};items.forEach(function(o){idx[itKey(o)]=o});
var seen={},fresh=[],changed=false;
list.forEach(function(n){var k=itKey(n);
var rt=(n.Rate==null?"":String(n.Rate)),qt=(n.Qty==null?"":String(n.Qty)),wr=(n.Warranty==null?"":String(n.Warranty)).trim();
var ex=seen[k]||idx[k];
if(ex){
if(rt!==""&&String(ex.Rate==null?"":ex.Rate)!==rt){ex.Rate=rt;changed=true}
if(qt!==""&&String(ex.Qty==null?"":ex.Qty)!==qt){ex.Qty=qt;changed=true}
