<script>
/* KING LOGIN KEEPER: login ko browser ke localStorage ke alawa cookie + IndexedDB me bhi rakhta hai.
   Browser localStorage saaf kar de to login apne-aap wapas aa jata hai. Logout dabane par sab hat jata hai. */
(function(){
var K=["kms_user","kms_orders","kms_buyer","kms_boy_mobile","kms_boy_info","kms_idov","kms_idov_all"],CK=["kms_user","kms_boy_mobile","kms_boy_info"],LS=null;
try{LS=window.localStorage}catch(e){return}
var S=Storage.prototype,_s=S.setItem,_r=S.removeItem,db=null,pend=[],seen={};
function ckGet(n){try{var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}catch(e){return null}}
function ckSet(n,v){try{document.cookie=n+"="+(v==null?"":encodeURIComponent(v))+"; max-age="+(v==null?0:63072000)+"; path=/; SameSite=Lax"}catch(e){}}
function idb(cb){if(db)return cb(db);try{var q=indexedDB.open("king_keep",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv")};q.onsuccess=function(){db=q.result;cb(db)};q.onerror=function(){cb(null)}}catch(e){cb(null)}}
function idbPut(k,v){idb(function(d){if(!d)return;try{var t=d.transaction("kv","readwrite").objectStore("kv");if(v==null)t["delete"](k);else t.put(v,k)}catch(e){}})}
function idbGet(k,cb){idb(function(d){if(!d)return cb(null);try{var r=d.transaction("kv").objectStore("kv").get(k);r.onsuccess=function(){cb(r.result==null?null:r.result)};r.onerror=function(){cb(null)}}catch(e){cb(null)}})}
function mirror(k,v){if(K.indexOf(k)<0)return;idbPut(k,v);if(CK.indexOf(k)>-1)ckSet(k,v)}
S.setItem=function(k,v){_s.apply(this,arguments);if(this===LS)mirror(k,String(v))};
S.removeItem=function(k){_r.apply(this,arguments);if(this===LS)mirror(k,null)};
/* 1) shuru me: agar localStorage khali hai to cookie se turant wapas lao */
CK.forEach(function(k){try{if(LS.getItem(k)==null){var c=ckGet(k);if(c){_s.call(LS,k,c)}}}catch(e){}});
/* 2) IndexedDB se baaki (orders wagairah) wapas lao; kuch wapas aaya to page ek baar refresh */
var left=K.length,rest=0;
K.forEach(function(k){try{if(LS.getItem(k)!=null){left--;return}}catch(e){left--;return}
 idbGet(k,function(v){if(v!=null){try{_s.call(LS,k,v);rest++}catch(e){}}if(--left===0&&rest){try{if(!sessionStorage.getItem("kk_r")){sessionStorage.setItem("kk_r","1");location.reload()}}catch(e){}}})});
if(left===0&&false){}
/* 3) har 3 second me jaanch: kuch badla ho (iframe me bhi) to backup update, logout ho to backup hata do */
function tick(){K.forEach(function(k){var v=null;try{v=LS.getItem(k)}catch(e){}
 if(v!=null){if(seen[k]!==v){seen[k]=v;mirror(k,v)}}else if(seen[k]!=null){seen[k]=null;mirror(k,null)}})}
setInterval(tick,3000);setTimeout(tick,500);
document.addEventListener("visibilitychange",function(){if(document.hidden)tick()});
window.addEventListener("pagehide",tick);
/* 4) browser ko bolo ki is site ka data na hataye */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>

/* Flipkart design: grey photo tile, naam upar, Market Rs bada + Rs bold */

<script>
/* ===== उधार + ऑफर: दोनों Daily Hisab से आते हैं (ग्राहक के मोबाइल नंबर के हिसाब से) ===== */
var OFFK="kms_offon",OUSEK="kms_offused";
var OFF_SESS=false; /* ऑफर हर बार बंद से शुरू; ON करने पर बस इसी बार, Refresh पर फिर बंद */
function offOn(){if(offLocked())return false;return OFF_SESS===true}
function setOffOn(v){OFF_SESS=!!v}
/* Daily Hisab का credit, उसमें से वो घटाकर जो इस फ़ोन से ऑर्डर में लग चुका (Daily Hisab में नया आंकड़ा आते ही फिर Daily Hisab का ही माना जाता है) */
function offAvail(){var c=custGet();if(!c.m)return 0;var o=null;try{o=JSON.parse(localStorage.getItem(OUSEK)||"null")}catch(e){}
if(o&&String(o.m)===String(c.m)&&Number(o.sc)===c.credit)return Math.max(0,Math.round((c.credit-Number(o.used||0))*100)/100);return c.credit}
function offConsume(d){var c=custGet();if(!c.m||!(d>0))return;var o=null;try{o=JSON.parse(localStorage.getItem(OUSEK)||"null")}catch(e){}
var u=(o&&String(o.m)===String(c.m)&&Number(o.sc)===c.credit)?Number(o.used||0):0;
try{localStorage.setItem(OUSEK,JSON.stringify({m:c.m,sc:c.credit,used:u+d}))}catch(e){}}
/* ===== उधार हो तो ऑफर बंद (कटा हुआ) जब तक उधार जमा न हो ===== */
function offLocked(){return custGet().due>0}
function offFmt(n){n=Number(n)||0;return n>0?fmtN(n):"00"}
function offMsg(){var d=document.getElementById("offmsg");if(d)d.remove();
d=document.createElement("div");d.id="offmsg";
d.style.cssText="position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:22px";
d.innerHTML='<div style="background:#fff;border-radius:14px;max-width:340px;width:100%;padding:22px 18px 16px;text-align:center;font-family:inherit"><div style="font-size:40px;line-height:1">🔒</div><div style="font-size:17px;font-weight:900;color:#b42410;margin:10px 0 6px">ऑफर अभी बंद है</div><div style="font-size:16px;font-weight:700;color:#222;line-height:1.5">आप अपना पहले उधार जमा करें, फिर आप ऑफर उपयोग कर पाएंगे।</div><div style="font-size:14px;font-weight:800;color:#555;margin-top:8px">आपका उधार: ₹'+fmtN(custGet().due)+'</div><button style="margin-top:14px;border:0;background:#e63c1f;color:#fff;font-weight:900;font-size:16px;border-radius:10px;padding:10px 34px;cursor:pointer;font-family:inherit">ठीक है</button></div>';
d.addEventListener("click",function(){d.remove()});document.body.appendChild(d)}
/* ऑर्डर कैंसिल होने पर ऑफर वापस (इसी फ़ोन से लगे ऑफर के लिए, एक ही बार) */
function offGive(d){var c=custGet();if(!c.m||!(d>0))return;var o=null;try{o=JSON.parse(localStorage.getItem(OUSEK)||"null")}catch(e){}
if(o&&String(o.m)===String(c.m)&&Number(o.sc)===c.credit){try{localStorage.setItem(OUSEK,JSON.stringify({m:c.m,sc:c.credit,used:Math.max(0,Number(o.used||0)-d)}))}catch(e){}}}
function offPost(op,o){if(typeof ORDER_URL==="undefined"||!ORDER_URL)return;try{fetch(ORDER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"offer",op:op,id:o.id,mobile:t10(o.mobile),amount:Number(o.offer)||0})}).catch(function(){})}catch(e){}}
function offSweep(a){var ch=false;a.forEach(function(o){var s=normSt(o.status);
if(o&&Number(o.offer)>0&&(s==="Cancelled"||s==="DelCancelled")&&String(o.offerref)!=="1"){o.offerref="1";ch=true;if(o.offLocal===1)offGive(Number(o.offer));offPost("refund",o)}});return ch}
function offRs(){return offOn()?offAvail():0}   /* ऑफर ON हो तभी छूट लगती है */
function offPU(R0,q){var c=offRs();if(R0===null||R0===undefined||c<=0||!(q>0))return 0;return Math.min(c,R0*q)/q}
var CUSTK="kms_cust";
function custGet(){try{var c=JSON.parse(localStorage.getItem(CUSTK)||"null"),u=JSON.parse(localStorage.getItem("kms_user")||"null");
if(c&&u&&String(c.m)===String(u.m))return{m:c.m,due:Number(c.due)||0,credit:Number(c.credit)||0}}catch(e){}return{m:"",due:0,credit:0}}
function fmtN(n){return(Math.round(Number(n)*100)/100).toLocaleString("en-IN")}
function hasR(o){return o&&o.Rate!==undefined&&o.Rate!==null&&o.Rate!==""}
function effRate(r){var n=parseFloat(String(r==null?"":r).replace(/,/g,""));return isNaN(n)?null:Math.max(0,n-offRs())}
function mkStr(o){return(o.MRate!==undefined&&o.MRate!==null&&o.MRate!=="")?o.MRate:o.Rate}
function offPct(o){if(!hasR(o))return 0;var m=parseFloat(String(mkStr(o)).replace(/,/g,"")),e=effRate(o.Rate);return(m>0&&e!==null&&m>e)?Math.round((m-e)/m*100):0}
function offLbl(){var c=offRs();return c>0?"ऑफर ₹"+fmtN(c)+" की छूट":""}
/* ===== माल की सिंक: KING_MOBILE.html वाली वही Google Sheet (Items) -> यह पेज ===== */
var GAS="https://script.google.com/macros/s/AKfycbzEeBH83lSB2w4TUS1geSCbuBSyoUl91Kin98TSyN9hbL71BZmhO-wiBHMpVAo1PcoUsg/exec";
var ITEM_POLL_MS=1000;   /* कितने मिलीसेकंड में माल देखना है (1000 = 1 सेकंड) */
var itemV=null,itemBusy=false,itemFails=0,itemNext=0;
function itKey(o){return String(o.Item==null?"":o.Item).trim().toLowerCase()+"|"+String(o.SKU==null?"":o.SKU).trim().toLowerCase()}
function itOverlay(){var a=["dt","ps","pv","sk","by"];for(var i=0;i<a.length;i++){var e=document.getElementById(a[i]);if(e&&e.classList.contains("on"))return true}return false}
function itApply(list){
if(!list||!list.length)return false;
try{phClean(list)}catch(e){}
var idx={};items.forEach(function(o){idx[itKey(o)]=o});
var seen={},fresh=[],changed=false;
list.forEach(function(n){var k=itKey(n);try{phSrvNote(n)}catch(e){}
var rt=(n.Rate==null?"":String(n.Rate)),qt=(n.Qty==null?"":String(n.Qty)),wr=(n.Warranty==null?"":String(n.Warranty)).trim();
var ex=seen[k]||idx[k];
if(ex){
if(String(ex.Rate==null?"":ex.Rate)!==rt){if(rt==="")delete ex.Rate;else ex.Rate=rt;changed=true}
if(String(ex.Qty==null?"":ex.Qty)!==qt){if(qt==="")delete ex.Qty;else ex.Qty=qt;changed=true}
if(String(ex.Warranty==null?"":ex.Warranty)!==wr){if(wr==="")delete ex.Warranty;else ex.Warranty=wr;changed=true}
if(!PHPEND[phKey(ex)]){if(n.Photos&&n.Photos.length){if((ex.Photos||[]).join("|")!==n.Photos.join("|")){ex.Photos=n.Photos.slice();changed=true}}else if(ex.Photos&&ex.Photos.length&&ex.Photos.every(isSrvUrl)){delete ex.Photos;changed=true}}

function end(){if(fin)return;fin=true;if(btn){btn.disabled=false;btn.textContent=old||"✅ Order Now"}
var bad=false;ms.forEach(function(m){if(kmLocalBlocked(m))bad=true});if(bad){kmShowBlock();return}go()}
if(!ORDER_URL||!ms.length){end();return}
var tm=setTimeout(end,4500);
function one(){if(--left<=0){clearTimeout(tm);end()}}
ms.forEach(function(m){try{fetch(ORDER_URL+(ORDER_URL.indexOf("?")<0?"?":"&")+"action=my&mobile="+m+"&t="+Date.now()).then(function(r){return r.json()}).then(function(j){try{mergeMine((j&&j.orders)||[])}catch(e){}one()}).catch(one)}catch(e){one()}})}
var kmPass=0,_kmCB=confirmBuy,_kmSB=sendBuy,_kmOB=openBuy;
confirmBuy=function(){if(Date.now()-kmPass<90000){return _kmCB()}kmGateAll(kmMobiles(),function(){kmPass=Date.now();_kmCB()})};
sendBuy=function(){if(Date.now()-kmPass<90000){kmPass=0;return _kmSB()}kmGateAll(kmMobiles(),function(){kmPass=0;_kmSB()})};
openBuy=function(i){var u=getUser();if(u&&u.m&&kmLocalBlocked(t10(u.m))){kmShowBlock();try{syncOrders()}catch(e){}return}_kmOB(i)};
</script>
